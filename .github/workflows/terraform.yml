name: terraform

on:
  push:
    branches: [main]
    paths: ["**.tf", "**.tflint.hcl", "**/.terraform.lock.hcl", ".github/workflows/terraform.yml"]
  pull_request:
    paths: ["**.tf", "**.tflint.hcl", "**/.terraform.lock.hcl", ".github/workflows/terraform.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    # No AWS credentials: these checks read the code only. Deploying is done from a workstation for now,
    # and moves to a gated pipeline in module 13.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [10-s3-static-website/terraform, 11-rds-sql-server/terraform, 12-terraform-vpc-ec2/terraform]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform init (no backend) and validate
        run: |
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}   # avoids rate limits when tflint downloads its AWS plugin
        run: |
          tflint --init
          tflint --format compact

      - name: checkov
        run: pipx run checkov==3.3.21 -d . --framework terraform --compact --quiet
